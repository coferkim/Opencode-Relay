name: Checks and Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Test, typecheck and build
        run: |
          bun test
          bunx tsc --noEmit
      - name: Build Docker service and check health
        run: |
          docker compose config --quiet
          docker compose build --pull
          docker compose up -d --wait --wait-timeout 90
          curl --fail --silent http://127.0.0.1:8948/api/health
          curl --fail --silent http://127.0.0.1:8948/ | grep -q '<div id="app">'
          curl --fail --silent http://127.0.0.1:8948/openapi.json > /dev/null
          curl --fail --silent http://127.0.0.1:8948/docs | grep -q 'OpenCode Relay API'
          bun tests/verify_docker.ts
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans
